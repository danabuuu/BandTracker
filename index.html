<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Band Activity Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
  <style>
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    select option { background-color: #1e293b; color: white; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { createClient } = supabase;

    const SUPABASE_URL = 'https://yhchfhhdrfcotlvyoogz.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InloY2hmaGhkcmZjb3Rsdnlvb2d6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkxMjEwNTAsImV4cCI6MjA4NDY5NzA1MH0.W5W4DA5_GdC0--WwTSVsBIKZi88xxJDKf4ri2m8gjxk';
    
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

    // Uptime ping: if ?uptime is in the URL, run a lightweight DB query and
    // render a plain "OK" response so UptimeRobot can confirm the DB is alive.
    if (new URLSearchParams(window.location.search).has('uptime')) {
      (async () => {
        try {
          await supabaseClient.from('songs').select('id').limit(1);
          document.getElementById('root').innerHTML =
            '<pre style="font-family:monospace;padding:1rem">OK</pre>';
        } catch (e) {
          document.getElementById('root').innerHTML =
            '<pre style="font-family:monospace;padding:1rem">ERROR: ' + e.message + '</pre>';
        }
      })();
    } else {

    const Icon = ({ name, className = "" }) => <i className={`fas fa-${name} ${className}`}></i>;

    function BandTracker() {
      const [activeTab, setActiveTab] = useState('repertoire');
      const [songs, setSongs] = useState([]);
      const [gigs, setGigs] = useState([]);
      const [editingId, setEditingId] = useState(null);
      const [loading, setLoading] = useState(true);
      const [viewMode, setViewMode] = useState('cards');
      const [selectedSongs, setSelectedSongs] = useState([]);
      const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
      const [searchQuery, setSearchQuery] = useState({});
      const [showSuggestions, setShowSuggestions] = useState({});
      const [expandedGigs, setExpandedGigs] = useState({});
      const [repertoireSearch, setRepertoireSearch] = useState('');
      const [repertoireSort, setRepertoireSort] = useState('title');
      const [gigsSearch, setGigsSearch] = useState('');
      const [gigsSort, setGigsSort] = useState('date');
      const [showAddSongForm, setShowAddSongForm] = useState(false);
      const [newSongForm, setNewSongForm] = useState({
        title: '',
        artist: '',
        duration: '',
        key: '',
        genre: '',
        composers: '',
        voicing: '',
        notes: ''
      });
      const [showNewSongSuggestions, setShowNewSongSuggestions] = useState({
        genre: false,
        composers: false
      });
      const [newSongSuggestionIndex, setNewSongSuggestionIndex] = useState({
        genre: 0,
        composers: 0
      });
      const [newSongSuggestionPosition, setNewSongSuggestionPosition] = useState({
        genre: null,
        composers: null
      });
      const newSongGenreRef = useRef(null);
      const newSongComposersRef = useRef(null);
      const [editSongSuggestions, setEditSongSuggestions] = useState({
        songId: null,
        field: null
      });
      const [editSongSuggestionIndex, setEditSongSuggestionIndex] = useState(0);
      const [editSongSuggestionPosition, setEditSongSuggestionPosition] = useState({
        top: 0,
        left: 0,
        width: 0
      });
      const editSongSuggestionInputRef = useRef(null);
      const [showAddGigForm, setShowAddGigForm] = useState(false);
      const [newGigForm, setNewGigForm] = useState({
        name: '',
        venue: '',
        date: '',
        time: '',
        notes: ''
      });
      const [user, setUser] = useState(null);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [showAuthError, setShowAuthError] = useState(false);
      const [authErrorMessage, setAuthErrorMessage] = useState('');
      const [showPasswordScreen, setShowPasswordScreen] = useState(true);
      const [draggingSetlist, setDraggingSetlist] = useState(null);
      const [dragOverSetlistIndex, setDragOverSetlistIndex] = useState(null);
      const [deepLinkGigId] = useState(() => new URLSearchParams(window.location.search).get('setlist'));
      const [copiedGigId, setCopiedGigId] = useState(null);
      const deepLinkApplied = useRef(false);

      useEffect(() => {
        checkUser();
        loadData();
      }, []);

      useEffect(() => {
        if (!showPasswordScreen && !loading && deepLinkGigId && !deepLinkApplied.current) {
          deepLinkApplied.current = true;
          setActiveTab('gigs');
          setExpandedGigs(prev => ({ ...prev, [deepLinkGigId]: true }));
          setTimeout(() => {
            const el = document.getElementById(`gig-${deepLinkGigId}`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }, 100);
        }
      }, [showPasswordScreen, loading]);

      const checkUser = async () => {
        const { data: { session } } = await supabaseClient.auth.getSession();
        setUser(session?.user || null);
        if (session?.user) {
          setShowPasswordScreen(false);
        }
      };

      const loadData = async () => {
        try {
          const { data: songsData } = await supabaseClient.from('songs').select('*').order('created_at', { ascending: false });
          const { data: gigsData } = await supabaseClient.from('gigs').select('*').order('date', { ascending: false });
          const { data: setlistData } = await supabaseClient.from('setlist_items').select('*').order('position');

          if (songsData) setSongs(songsData);
          
          if (gigsData && setlistData) {
            const gigsWithSetlists = gigsData.map(gig => ({
              ...gig,
              setlist: setlistData.filter(item => item.gig_id === gig.id).sort((a, b) => a.position - b.position).map(item => item.song_id)
            }));
            setGigs(gigsWithSetlists);
          }
        } catch (error) {
          console.error('Error loading data:', error);
        } finally {
          setLoading(false);
        }
      };
      // Song Management Functions
      const addSong = () => {
        const newSong = {
          id: `temp-${Date.now()}`,
          title: '',
          artist: '',
          duration: '',
          key: '',
          genre: '',
          composers: '',
          voicing: '',
          notes: '',
          editing: true
        };
        setSongs([newSong, ...songs]);
        setEditingId(newSong.id);
      };

      const updateNewSongForm = (field, value) => {
        setNewSongForm(prev => ({ ...prev, [field]: value }));
      };

      const getSuggestionValues = (field) => {
        const values = [];
        songs.forEach(song => {
          const rawValue = field === 'composers'
            ? (song.composers || song.composer || '')
            : song[field];
          if (!rawValue) return;
          const raw = Array.isArray(rawValue) ? rawValue.join(', ') : String(rawValue);
          if (!raw.trim()) return;
          raw
            .split(/[,;/]/)
            .map(value => value.trim())
            .filter(Boolean)
            .forEach(value => values.push(value));
        });
        return Array.from(new Set(values));
      };

      const getSuggestionsForField = (field, query) => {
        if (!query.trim()) return [];
        const lowerQuery = query.toLowerCase();
        return getSuggestionValues(field)
          .filter(value => value.toLowerCase().includes(lowerQuery))
          .sort((a, b) => a.localeCompare(b))
          .slice(0, 8);
      };

      const applySuggestionToNewSong = (field, value) => {
        updateNewSongForm(field, value);
        setShowNewSongSuggestions(prev => ({ ...prev, [field]: false }));
      };

      const updateNewSongSuggestionPosition = (field, inputEl) => {
        if (!inputEl) return;
        const rect = inputEl.getBoundingClientRect();
        setNewSongSuggestionPosition(prev => ({
          ...prev,
          [field]: {
            top: rect.bottom + window.scrollY + 6,
            left: rect.left + window.scrollX,
            width: rect.width
          }
        }));
      };

      const updateEditSongSuggestionPosition = (inputEl) => {
        if (!inputEl) return;
        const rect = inputEl.getBoundingClientRect();
        setEditSongSuggestionPosition({
          top: rect.bottom + window.scrollY + 6,
          left: rect.left + window.scrollX,
          width: rect.width
        });
      };

      const openEditSongSuggestions = (songId, field, inputEl) => {
        editSongSuggestionInputRef.current = inputEl;
        updateEditSongSuggestionPosition(inputEl);
        setEditSongSuggestions({ songId, field });
        setEditSongSuggestionIndex(0);
      };

      const closeEditSongSuggestions = () => {
        setEditSongSuggestions({ songId: null, field: null });
      };

      const applySuggestionToSong = (songId, field, value) => {
        updateSong(songId, field, value);
        closeEditSongSuggestions();
      };

      const handleNewSongSuggestionKeyDown = (field, e) => {
        const suggestions = getSuggestionsForField(field, newSongForm[field] || '');
        if (!suggestions.length) return;
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          setNewSongSuggestionIndex(prev => ({
            ...prev,
            [field]: (prev[field] + 1) % suggestions.length
          }));
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          setNewSongSuggestionIndex(prev => ({
            ...prev,
            [field]: (prev[field] - 1 + suggestions.length) % suggestions.length
          }));
        } else if (e.key === 'Enter') {
          e.preventDefault();
          const value = suggestions[newSongSuggestionIndex[field]];
          if (value) applySuggestionToNewSong(field, value);
        } else if (e.key === 'Escape') {
          e.preventDefault();
          setShowNewSongSuggestions(prev => ({ ...prev, [field]: false }));
        }
      };

      const handleEditSongSuggestionKeyDown = (songId, field, e) => {
        const song = songs.find(s => s.id === songId);
        if (!song) return;
        const suggestions = getSuggestionsForField(field, song[field] || '');
        if (!suggestions.length) return;
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          setEditSongSuggestionIndex(prev => (prev + 1) % suggestions.length);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          setEditSongSuggestionIndex(prev => (prev - 1 + suggestions.length) % suggestions.length);
        } else if (e.key === 'Enter') {
          e.preventDefault();
          const value = suggestions[editSongSuggestionIndex];
          if (value) applySuggestionToSong(songId, field, value);
        } else if (e.key === 'Escape') {
          e.preventDefault();
          closeEditSongSuggestions();
        }
      };

      useEffect(() => {
        const handleReposition = () => {
          if (showNewSongSuggestions.genre && newSongGenreRef.current) {
            updateNewSongSuggestionPosition('genre', newSongGenreRef.current);
          }
          if (showNewSongSuggestions.composers && newSongComposersRef.current) {
            updateNewSongSuggestionPosition('composers', newSongComposersRef.current);
          }
          if (editSongSuggestions.songId && editSongSuggestionInputRef.current) {
            updateEditSongSuggestionPosition(editSongSuggestionInputRef.current);
          }
        };
        window.addEventListener('scroll', handleReposition, true);
        window.addEventListener('resize', handleReposition);
        return () => {
          window.removeEventListener('scroll', handleReposition, true);
          window.removeEventListener('resize', handleReposition);
        };
      }, [showNewSongSuggestions.genre, showNewSongSuggestions.composers, editSongSuggestions.songId]);

      const createSongFromForm = async () => {
        if (!user || !newSongForm.title.trim()) return;
        try {
          const { data } = await supabaseClient.from('songs').insert([{
            title: newSongForm.title.trim(),
            artist: newSongForm.artist,
            duration: newSongForm.duration,
            key: newSongForm.key,
            genre: newSongForm.genre,
            composers: newSongForm.composers,
            voicing: newSongForm.voicing,
            notes: newSongForm.notes
          }]).select();
          if (data && data[0]) {
            setSongs([data[0], ...songs]);
            setNewSongForm({
              title: '',
              artist: '',
              duration: '',
              key: '',
              genre: '',
              composers: '',
              voicing: '',
              notes: ''
            });
            setShowAddSongForm(false);
          }
        } catch (error) {
          console.error('Error creating song:', error);
          alert('Error creating song. Please try again.');
        }
      };

      const updateSong = (id, field, value) => {
        setSongs(songs.map(song => song.id === id ? { ...song, [field]: value } : song));
      };

      const saveSong = async (id) => {
        const song = songs.find(s => s.id === id);
        if (!song.title.trim()) return;

        try {
          const tempoVal = song.tempo ? parseInt(String(song.tempo)) || null : null;
          const beatsVal = song.beats_in_scroll ? parseInt(String(song.beats_in_scroll)) || null : null;
          if (String(id).startsWith('temp-')) {
            const { data } = await supabaseClient.from('songs').insert([{
              title: song.title,
              artist: song.artist,
              duration: song.duration,
              key: song.key,
              genre: song.genre,
              composers: song.composers,
              voicing: song.voicing,
              notes: song.notes,
              tempo: tempoVal,
              beats_in_scroll: beatsVal,
            }]).select();
            if (data) setSongs(songs.map(s => s.id === id ? { ...data[0], editing: false } : s));
          } else {
            await supabaseClient.from('songs').update({
              title: song.title,
              artist: song.artist,
              duration: song.duration,
              key: song.key,
              genre: song.genre,
              composers: song.composers,
              voicing: song.voicing,
              notes: song.notes,
              tempo: tempoVal,
              beats_in_scroll: beatsVal,
            }).eq('id', id);
            setSongs(songs.map(s => s.id === id ? { ...s, editing: false } : s));
          }
          setEditingId(null);
        } catch (error) {
          console.error('Error saving song:', error);
          alert('Error saving song. Please try again.');
        }
      };

      const saveAllSongs = async () => {
        try {
          for (const song of songs) {
            if (!String(song.id).startsWith('temp-')) {
              await supabaseClient.from('songs').update({
                title: song.title,
                artist: song.artist,
                duration: song.duration,
                key: song.key,
                genre: song.genre,
                composers: song.composers,
                voicing: song.voicing,
                notes: song.notes
              }).eq('id', song.id);
            }
          }
          alert('All changes saved!');
        } catch (error) {
          console.error('Error saving songs:', error);
          alert('Error saving changes.');
        }
      };

      const deleteSong = async (id) => {
        if (String(id).startsWith('temp-')) {
          setSongs(songs.filter(s => s.id !== id));
        } else {
          await supabaseClient.from('songs').delete().eq('id', id);
          setSongs(songs.filter(s => s.id !== id));
        }
      };

      const toggleSongSelection = (id) => {
        setSelectedSongs(prev => prev.includes(id) ? prev.filter(songId => songId !== id) : [...prev, id]);
      };

      const toggleAllSongs = () => {
        setSelectedSongs(selectedSongs.length === getFilteredAndSortedSongs().length ? [] : getFilteredAndSortedSongs().map(s => s.id));
      };

      const deleteSelectedSongs = () => {
        if (selectedSongs.length === 0) return;
        setShowDeleteConfirm(true);
      };

      const confirmDelete = async () => {
        const realIds = selectedSongs.filter(id => !String(id).startsWith('temp-'));
        if (realIds.length > 0) {
          await supabaseClient.from('songs').delete().in('id', realIds);
        }
        setSongs(songs.filter(s => !selectedSongs.includes(s.id)));
        setSelectedSongs([]);
        setShowDeleteConfirm(false);
      };

      const cancelDelete = () => setShowDeleteConfirm(false);

      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        Papa.parse(file, {
          header: true,
          skipEmptyLines: true,
          complete: async (results) => {
            const importedSongs = results.data.map(row => ({
              title: row.title || row.Title || row.song || row.Song || '',
              artist: row.artist || row.Artist || '',
              duration: row.duration || row.Duration || '',
              key: row.key || row.Key || '',
              genre: row.genre || row.Genre || '',
              composers: row.composers || row.Composers || '',
              voicing: row.voicing || row.Voicing || '',
              notes: row.notes || row.Notes || ''
            })).filter(song => song.title.trim());

            if (importedSongs.length > 0) {
              const { data } = await supabaseClient.from('songs').insert(importedSongs).select();
              if (data) {
                setSongs([...data, ...songs]);
                alert(`Successfully imported ${importedSongs.length} songs!`);
              }
            }
          },
          error: () => alert('Error reading file.')
        });
        e.target.value = '';
      };
      
      // Gig File Upload
      const handleGigFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        Papa.parse(file, {
          header: true,
          skipEmptyLines: true,
          complete: async (results) => {
            for (const row of results.data) {
              const gigName = row.name || row.Name || row.gig || row.Gig || '';
              if (!gigName.trim()) continue;

              // Create the gig
              const { data: gigData } = await supabaseClient.from('gigs').insert([{
                name: gigName,
                venue: row.venue || row.Venue || '',
                date: row.date || row.Date || null,
                time: row.time || row.Time || '',
                notes: row.notes || row.Notes || ''
              }]).select();

              if (gigData && gigData[0]) {
                const gigId = gigData[0].id;
                
                // Parse setlist (semicolon-separated song titles)
                const setlistStr = row.setlist || row.Setlist || '';
                if (setlistStr.trim()) {
                  const songTitles = setlistStr.split(';').map(t => t.trim()).filter(t => t);
                  const setlistItems = [];
                  
                  for (let i = 0; i < songTitles.length; i++) {
                    const song = songs.find(s => s.title.toLowerCase() === songTitles[i].toLowerCase());
                    if (song) {
                      setlistItems.push({
                        gig_id: gigId,
                        song_id: song.id,
                        position: i
                      });
                    }
                  }
                  
                  if (setlistItems.length > 0) {
                    await supabaseClient.from('setlist_items').insert(setlistItems);
                  }
                }
              }
            }
            
            await loadData(); // Reload to show new gigs
            alert('Gigs imported successfully!');
          },
          error: () => alert('Error reading file.')
        });
        e.target.value = '';
      };
      // Gig Management Functions
      const addGig = () => {
        const newGig = {
          id: `temp-${Date.now()}`,
          name: '',
          venue: '',
          date: '',
          time: '',
          setlist: [],
          notes: '',
          editing: true
        };
        setGigsSearch('');
        setExpandedGigs(prev => ({ ...prev, [newGig.id]: true }));
        setGigs([newGig, ...gigs]);
        setEditingId(newGig.id);
      };

      const updateNewGigForm = (field, value) => {
        setNewGigForm(prev => ({ ...prev, [field]: value }));
      };

      const createGigFromForm = async () => {
        if (!user || !newGigForm.name.trim()) return;
        try {
          const { data } = await supabaseClient.from('gigs').insert([{
            name: newGigForm.name.trim(),
            venue: newGigForm.venue,
            date: newGigForm.date || null,
            time: newGigForm.time,
            notes: newGigForm.notes
          }]).select();
          if (data && data[0]) {
            const createdGig = { ...data[0], setlist: [] };
            setGigs([createdGig, ...gigs]);
            setExpandedGigs(prev => ({ ...prev, [createdGig.id]: true }));
            setNewGigForm({ name: '', venue: '', date: '', time: '', notes: '' });
            setShowAddGigForm(false);
          }
        } catch (error) {
          console.error('Error creating gig:', error);
          alert('Error creating gig. Please try again.');
        }
      };

      const updateGig = (id, field, value) => {
        setGigs(gigs.map(gig => gig.id === id ? { ...gig, [field]: value } : gig));
      };

      const saveGig = async (id) => {
        const gig = gigs.find(g => g.id === id);
        if (!gig.name.trim()) return;

        try {
          if (String(id).startsWith('temp-')) {
            const { data } = await supabaseClient.from('gigs').insert([{
              name: gig.name,
              venue: gig.venue,
              date: gig.date || null,
              time: gig.time,
              notes: gig.notes
            }]).select();
            if (data) {
              setGigs(gigs.map(g => g.id === id ? { ...data[0], setlist: [], editing: false } : g));
            }
          } else {
            await supabaseClient.from('gigs').update({
              name: gig.name,
              venue: gig.venue,
              date: gig.date || null,
              time: gig.time,
              notes: gig.notes
            }).eq('id', id);
            setGigs(gigs.map(g => g.id === id ? { ...g, editing: false } : g));
          }
          setEditingId(null);
        } catch (error) {
          console.error('Error saving gig:', error);
        }
      };

      const deleteGig = async (id) => {
        if (!String(id).startsWith('temp-')) {
          await supabaseClient.from('gigs').delete().eq('id', id);
        }
        setGigs(gigs.filter(g => g.id !== id));
      };

      const addSongToSetlist = async (gigId, songId) => {
        const gig = gigs.find(g => g.id === gigId);
        if (!gig || gig.setlist.includes(songId) || String(gigId).startsWith('temp-')) return;

        const newSetlist = [...gig.setlist, songId];
        await supabaseClient.from('setlist_items').insert({
          gig_id: gigId,
          song_id: songId,
          position: newSetlist.length - 1
        });
        
        setGigs(gigs.map(g => g.id === gigId ? { ...g, setlist: newSetlist } : g));
        setSearchQuery(prev => ({ ...prev, [gigId]: '' }));
        setShowSuggestions(prev => ({ ...prev, [gigId]: false }));
      };

      const getFilteredSongs = (gigId) => {
        const gig = gigs.find(g => g.id === gigId);
        if (!gig) return [];
        const query = searchQuery[gigId] || '';
        if (!query.trim()) return [];
        const lowerQuery = query.toLowerCase();
        return songs.filter(song =>
          !gig.setlist.includes(song.id) &&
          (song.title.toLowerCase().includes(lowerQuery) ||
           song.artist?.toLowerCase().includes(lowerQuery) ||
           song.genre?.toLowerCase().includes(lowerQuery))
        );
      };

      const persistSetlistOrder = async (gigId, setlist) => {
        if (String(gigId).startsWith('temp-')) return;
        await supabaseClient.from('setlist_items').delete().eq('gig_id', gigId);
        const items = setlist.map((song_id, pos) => ({
          gig_id: gigId,
          song_id,
          position: pos
        }));
        if (items.length > 0) {
          await supabaseClient.from('setlist_items').insert(items);
        }
      };

      const moveSetlistSong = async (gigId, songId, direction) => {
        const gig = gigs.find(g => g.id === gigId);
        if (!gig || String(gigId).startsWith('temp-')) return;

        const setlist = [...gig.setlist];
        const index = setlist.indexOf(songId);
        if (index === -1) return;

        const newIndex = direction === 'up' ? index - 1 : index + 1;
        if (newIndex < 0 || newIndex >= setlist.length) return;

        [setlist[index], setlist[newIndex]] = [setlist[newIndex], setlist[index]];
        await persistSetlistOrder(gigId, setlist);
        setGigs(gigs.map(g => g.id === gigId ? { ...g, setlist } : g));
      };

      const handleSetlistDragStart = (e, gigId, songId) => {
        if (!user) return;
        if (e?.dataTransfer) {
          e.dataTransfer.setData('text/plain', String(songId));
          e.dataTransfer.effectAllowed = 'move';
        }
        setDraggingSetlist({ gigId, songId });
      };

      const handleSetlistDragOver = (e, gigId, index) => {
        if (!user) return;
        if (!draggingSetlist || draggingSetlist.gigId !== gigId) return;
        e.preventDefault();
        e.stopPropagation();
        if (e?.dataTransfer) {
          e.dataTransfer.dropEffect = 'move';
        }
        setDragOverSetlistIndex(index);
      };

      const handleSetlistDrop = async (e, gigId, dropIndex) => {
        if (!user) return;
        if (!draggingSetlist || draggingSetlist.gigId !== gigId) return;
        e.preventDefault();
        e.stopPropagation();
        const gig = gigs.find(g => g.id === gigId);
        if (!gig) return;
        const originalSetlist = [...gig.setlist];
        const fromIndex = originalSetlist.indexOf(draggingSetlist.songId);
        const setlist = originalSetlist.filter(id => id !== draggingSetlist.songId);
        if (dropIndex == null) {
          setDragOverSetlistIndex(null);
          setDraggingSetlist(null);
          return;
        }
        const adjustedIndex = fromIndex !== -1 && fromIndex < dropIndex ? dropIndex - 1 : dropIndex;
        const targetIndex = Math.min(Math.max(adjustedIndex, 0), setlist.length);
        const moved = draggingSetlist.songId;
        setlist.splice(targetIndex, 0, moved);
        await persistSetlistOrder(gigId, setlist);
        setGigs(gigs.map(g => g.id === gigId ? { ...g, setlist } : g));
        setDragOverSetlistIndex(null);
        setDraggingSetlist(null);
      };

      const handleSetlistDropOnContainer = async (e, gigId) => {
        if (!user) return;
        if (!draggingSetlist || draggingSetlist.gigId !== gigId) return;
        e.preventDefault();
        e.stopPropagation();
        const gig = gigs.find(g => g.id === gigId);
        if (!gig) return;
        const setlist = [...gig.setlist].filter(id => id !== draggingSetlist.songId);
        setlist.push(draggingSetlist.songId);
        await persistSetlistOrder(gigId, setlist);
        setGigs(gigs.map(g => g.id === gigId ? { ...g, setlist } : g));
        setDragOverSetlistIndex(null);
        setDraggingSetlist(null);
      };

      const handleSetlistDragEnd = () => {
        setDragOverSetlistIndex(null);
        setDraggingSetlist(null);
      };

      const removeFromSetlist = async (gigId, songId) => {
        const gig = gigs.find(g => g.id === gigId);
        if (!gig || String(gigId).startsWith('temp-')) return;

        const newSetlist = gig.setlist.filter(id => id !== songId);

      const toggleGigExpanded = (gigId) => {

      const collapseAllGigs = () => setExpandedGigs({});

      const exportRepertoireToCSV = () => {
        const csv = Papa.unparse(songs.map(song => ({
          title: song.title,
          artist: song.artist || '',

        link.click();
      };

      const exportGigsToCSV = () => {
        const gigsData = gigs.map(gig => ({

          venue: gig.venue || '',

          notes: gig.notes || '',
          setlist_count: gig.setlist.length,
          setlist: gig.setlist.map(id => songs.find(s => s.id === id)?.title || '').join('; ')

        const csv = Papa.unparse(gigsData);
        const blob = new Blob([csv], { type: 'text/csv' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `gigs_${new Date().toISOString().split('T')[0]}.csv`;
        link.click();
      };
      // Filter and Sort Functions
      const getFilteredAndSortedSongs = () => {
        let filtered = songs;
        if (repertoireSearch.trim()) {
          const query = repertoireSearch.toLowerCase();
          filtered = songs.filter(song =>
            song.title.toLowerCase().includes(query) ||
            song.artist?.toLowerCase().includes(query) ||
            song.genre?.toLowerCase().includes(query) ||
            song.composers?.toLowerCase().includes(query) ||
            song.key?.toLowerCase().includes(query)
          );
        }
        return [...filtered].sort((a, b) => {
          switch (repertoireSort) {
            case 'title': return a.title.localeCompare(b.title);
            case 'artist': return (a.artist || '').localeCompare(b.artist || '');
            case 'genre': return (a.genre || '').localeCompare(b.genre || '');
            case 'key': return (a.key || '').localeCompare(b.key || '');
            case 'date': return (b.created_at || '').localeCompare(a.created_at || '');
            default: return 0;
          }
        });
      };

      const getFilteredAndSortedGigs = () => {
        let filtered = gigs;
        if (gigsSearch.trim()) {
          const query = gigsSearch.toLowerCase();
          filtered = gigs.filter(gig =>
            gig.name.toLowerCase().includes(query) ||
            gig.venue?.toLowerCase().includes(query) ||
            gig.notes?.toLowerCase().includes(query)

        }
        return [...filtered].sort((a, b) => {
          switch (gigsSort) {
            case 'date':
              if (!a.date && !b.date) return 0;
              if (!a.date) return 1;
              if (!b.date) return -1;
              return new Date(b.date) - new Date(a.date);
            case 'name': return a.name.localeCompare(b.name);
            case 'venue': return (a.venue || '').localeCompare(b.venue || '');
            default: return 0;

                          </>
                        )}
                        <button
                          onClick={exportGigsToCSV}
                          className="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition-colors"
                        >
                          <Icon name="download" />
                          Export CSV
                        </button>
                        {user && (
                          <label className="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition-colors cursor-pointer">
                            <Icon name="upload" />
                            Import Gigs CSV
                            <input
                              type="file"
                              accept=".csv"
                              onChange={handleGigFileUpload}
                              className="hidden"
                            />
                          </label>
                        )}
                        
                        {user && (
                          <button
                            onClick={() => setShowAddGigForm(prev => !prev)}
                            className="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition-colors"
                          >
                            <Icon name="plus" />
                            {showAddGigForm ? 'Close Add Gig' : 'Add Gig'}
                          </button>
                        )}
                      </div>
                    </div>

                    {/* Search and Sort */}
                    <div className="mb-4 flex gap-3 flex-wrap">
                      <div className="flex-1 min-w-[200px] relative">
                        <Icon name="search" className="absolute left-3 top-1/2 transform -translate-y-1/2 text-white/50" />
                        <input
                          type="text"
                          placeholder="Search gigs..."
                          value={gigsSearch}
                          onChange={(e) => setGigsSearch(e.target.value)}
                          className="w-full bg-white/10 text-white placeholder-white/50 pl-10 pr-4 py-2 rounded-lg border border-white/30 focus:outline-none focus:border-white/60"
                        />
                      </div>
                      <select
                        value={gigsSort}
                        onChange={(e) => setGigsSort(e.target.value)}
                        className="bg-white/10 text-white px-4 py-2 rounded-lg border border-white/30 focus:outline-none focus:border-white/60"
                      >
                        <option value="date">Sort by Date</option>
                        <option value="name">Sort by Name</option>
                        <option value="venue">Sort by Venue</option>
                      </select>
                    </div>

                    {user && showAddGigForm && (
                      <div className="mb-6 bg-white/10 backdrop-blur rounded-lg p-4">
                        <h3 className="text-white font-semibold mb-3 flex items-center gap-2">
                          <Icon name="plus" />
                          Add Gig
                        </h3>
                        <div className="grid grid-cols-2 gap-3">
                          <input
                            type="text"
                            placeholder="Gig Name"
                            value={newGigForm.name}
                            onChange={(e) => updateNewGigForm('name', e.target.value)}
                            className="bg-white/20 text-white placeholder-white/50 px-3 py-2 rounded border border-white/30 focus:outline-none focus:border-white/60"
                          />
                          <input
                            type="text"
                            placeholder="Venue"
                            value={newGigForm.venue}
                            onChange={(e) => updateNewGigForm('venue', e.target.value)}
                            className="bg-white/20 text-white placeholder-white/50 px-3 py-2 rounded border border-white/30 focus:outline-none focus:border-white/60"
                          />
                        </div>
                        <div className="grid grid-cols-2 gap-3 mt-3">
                          <input
                            type="date"
                            value={newGigForm.date}
                            onChange={(e) => updateNewGigForm('date', e.target.value)}
                            className="bg-white/20 text-white px-3 py-2 rounded border border-white/30 focus:outline-none focus:border-white/60"
                          />
                          <input
                            type="time"
                            value={newGigForm.time}
                            onChange={(e) => updateNewGigForm('time', e.target.value)}
                            className="bg-white/20 text-white px-3 py-2 rounded border border-white/30 focus:outline-none focus:border-white/60"
                          />
                        </div>
                        <textarea
                          placeholder="Notes"
                          value={newGigForm.notes}
                          onChange={(e) => updateNewGigForm('notes', e.target.value)}
                          className="w-full bg-white/20 text-white placeholder-white/50 px-3 py-2 rounded border border-white/30 focus:outline-none focus:border-white/60 resize-none mt-3"
                          rows="2"
                        />
                        <div className="flex justify-end mt-3">
                          <button
                            onClick={createGigFromForm}
                            className="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition-colors"
                          >
                            <Icon name="save" />
                            Create Gig
                          </button>
                        </div>
                      </div>
                    )}

                    <div className="space-y-4">
                      {getFilteredAndSortedGigs().map(gig => (
                        <div
                          id={`gig-${gig.id}`}
                          key={gig.id}
                          className={`bg-white/10 backdrop-blur rounded-lg p-4 relative ${showSuggestions[gig.id] ? 'z-40' : 'z-0'}`}
                        >
                          {gig.editing || editingId === gig.id ? (
                            <div className="space-y-3">
                              <div className="grid grid-cols-2 gap-3">
                                <input
                                  type="text"
                                  placeholder="Gig Name"
                                  value={gig.name}
                                  onChange={(e) => updateGig(gig.id, 'name', e.target.value)}
                                  className="bg-white/20 text-white placeholder-white/50 px-3 py-2 rounded border border-white/30 focus:outline-none focus:border-white/60"
                                />
                                <input
                                  type="text"
                                  placeholder="Venue"
                                  value={gig.venue || ''}
                                  onChange={(e) => updateGig(gig.id, 'venue', e.target.value)}
                                  className="bg-white/20 text-white placeholder-white/50 px-3 py-2 rounded border border-white/30 focus:outline-none focus:border-white/60"
                                />
                              </div>
                              <div className="grid grid-cols-2 gap-3">
                                <input
                                  type="date"
                                  value={gig.date || ''}
                                  onChange={(e) => updateGig(gig.id, 'date', e.target.value)}
                                  className="bg-white/20 text-white px-3 py-2 rounded border border-white/30 focus:outline-none focus:border-white/60"
                                />
                                <input
                                  type="time"
                                  value={gig.time || ''}
                                  onChange={(e) => updateGig(gig.id, 'time', e.target.value)}
                                  className="bg-white/20 text-white px-3 py-2 rounded border border-white/30 focus:outline-none focus:border-white/60"
                                />
                              </div>
                              <textarea
                                placeholder="Notes"
                                value={gig.notes || ''}
                                onChange={(e) => updateGig(gig.id, 'notes', e.target.value)}
                                className="w-full bg-white/20 text-white placeholder-white/50 px-3 py-2 rounded border border-white/30 focus:outline-none focus:border-white/60 resize-none"
                                rows="2"
                              />
                              <div className="flex gap-2">
                                <button
                                  onClick={() => saveGig(gig.id)}
                                  className="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded flex items-center gap-2"
                                  disabled={!user}
                                >
                                  <Icon name="save" />
                                  Save
                                </button>
                                <button
                                  onClick={() => deleteGig(gig.id)}
                                  className="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded flex items-center gap-2"
                                  disabled={!user}
                                >
                                  <Icon name="trash" />
                                  Delete
                                </button>
                              </div>
                            </div>
                          ) : (
                            <div>
                              <div className="flex justify-between items-start mb-4">
                                <div className="flex-1">
                                  <div className="flex items-center gap-2">
                                    <button
                                      onClick={() => toggleGigExpanded(gig.id)}
                                      className="text-white/70 hover:text-white transition-colors p-1 -ml-1"
                                    >
                                      {expandedGigs[gig.id] ? <Icon name="chevron-down" /> : <Icon name="chevron-right" />}
                                    </button>
                                    <h3 className="text-xl font-bold text-white">{gig.name}</h3>
                                  </div>
                                  <div className="text-white/70 mt-1 ml-8">
                                    {gig.venue && <span className="mr-4">📍 {gig.venue}</span>}
                                    {gig.date && <span className="mr-4">📅 {gig.date}</span>}
                                    {gig.time && <span className="mr-3">🕐 {gig.time}</span>}
                                    <span className="text-white/50">({gig.setlist.length} songs)</span>
                                  </div>
                                  {gig.notes && <p className="text-white/60 mt-2 text-sm ml-8">{gig.notes}</p>}
                                </div>
                                <div className="flex gap-2 items-center">
                                  <button
                                    onClick={() => copySetlistLink(gig.id)}
                                    className={`transition-colors ${copiedGigId === gig.id ? 'text-green-300' : 'text-white/50 hover:text-white/90'}`}
                                    title="Copy link to this setlist"
                                  >
                                    <Icon name={copiedGigId === gig.id ? 'check' : 'link'} />
                                  </button>
                                  <button
                                    onClick={() => setEditingId(gig.id)}
                                    className="text-blue-300 hover:text-blue-100"
                                    disabled={!user}
                                  >
                                    <Icon name="edit" />
                                  </button>
                                  <button
                                    onClick={() => deleteGig(gig.id)}
                                    className="text-red-300 hover:text-red-100"
                                    disabled={!user}
                                  >
                                    <Icon name="trash" />
                                  </button>
                                </div>
                              </div>

                              {expandedGigs[gig.id] && (
                                <div className="mt-4 border-t border-white/20 pt-4 ml-8">
                                  {user && (
                                    <div className="relative mb-4 z-30">
                                      <h5 className="text-white/80 text-sm font-semibold mb-2">Add Song:</h5>
                                      <div className="relative">
                                        <input
                                          type="text"
                                          placeholder="Search songs by title, artist, or genre..."
                                          value={searchQuery[gig.id] || ''}
                                          onChange={(e) => {
                                            setSearchQuery(prev => ({ ...prev, [gig.id]: e.target.value }));
                                            setShowSuggestions(prev => ({ ...prev, [gig.id]: true }));
                                          }}
                                          onFocus={() => setShowSuggestions(prev => ({ ...prev, [gig.id]: true }))}
                                          onBlur={() => setTimeout(() => setShowSuggestions(prev => ({ ...prev, [gig.id]: false })), 200)}
className="w-full bg-white/10 text-white placeholder-white/50 px-4 py-2 rounded-lg border border-white/30 focus:outline-none focus:border-white/60"
/>
{showSuggestions[gig.id] && searchQuery[gig.id]?.trim() && (
<div className="absolute top-full left-0 right-0 mt-1 bg-gray-800 rounded-lg shadow-xl max-h-60 overflow-y-auto z-[9999] border border-white/20">
{getFilteredSongs(gig.id).length > 0 ? (
getFilteredSongs(gig.id).map(song => (
<button
key={song.id}
onClick={() => addSongToSetlist(gig.id, song.id)}
className="w-full text-left px-4 py-3 hover:bg-white/10 transition-colors border-b border-white/10 last:border-b-0"
>
<div className="text-white font-semibold">{song.title}</div>
<div className="text-white/60 text-sm">
{song.artist && <span className="mr-3">{song.artist}</span>}
{song.duration && <span className="mr-3">⏱️ {song.duration}</span>}
{song.key && <span>🎵 {song.key}</span>}
</div>
</button>
))
) : (
<div className="px-4 py-3 text-white/50 text-sm">
No songs found matching "{searchQuery[gig.id]}"
</div>
)}
</div>
)}
</div>
{songs.length === 0 && (
<p className="text-white/50 text-sm mt-2">Add songs to your repertoire first.</p>
)}
</div>
)}
                                  <h4 className="text-white font-semibold mb-3 flex items-center gap-2">
                                <Icon name="list" />
                                Setlist ({gig.setlist.length} songs)
                              </h4>

                              {gig.setlist.length > 0 ? (
                                <div
                                  className="space-y-2"
                                  onDragOver={(e) => {
                                    if (user && draggingSetlist?.gigId === gig.id) {
                                      e.preventDefault();
                                      if (e?.dataTransfer) {
                                        e.dataTransfer.dropEffect = 'move';
                                      }
                                      setDragOverSetlistIndex(gig.setlist.length);
                                    }
                                  }}
                                  onDrop={(e) => handleSetlistDropOnContainer(e, gig.id)}
                                >
                                  {gig.setlist.map((songId, index) => {
                                    const song = songs.find(s => s.id === songId);
                                    if (!song) return null;
                                    return (
                                      <div
                                        key={songId}
                                        onDragOver={(e) => handleSetlistDragOver(e, gig.id, index)}
                                        onDrop={(e) => handleSetlistDrop(e, gig.id, index)}
                                      >
                                        {dragOverSetlistIndex === index && (
                                          <div className="my-2 h-0.5 bg-blue-400/80 rounded" />
                                        )}
                                        <div
                                          draggable={!!user}
                                          onDragStart={(e) => handleSetlistDragStart(e, gig.id, songId)}
                                          onDragEnd={handleSetlistDragEnd}
                                          className={`bg-white/10 hover:bg-white/15 p-3 rounded transition-colors flex items-center gap-3 ${draggingSetlist?.songId === songId ? 'opacity-60' : ''}`}
                                        >
                                          <span className={`text-white/40 ${user ? 'cursor-grab' : ''}`} title="Drag to reorder">
                                            <Icon name="grip-vertical" />
                                          </span>
                                        <span className="text-white/60 font-bold text-sm w-8">{index + 1}.</span>
                                        <div className="flex-1">
                                          <div className="text-white font-semibold">{song.title}</div>
                                          <div className="text-white/60 text-sm">
                                            {song.duration && <span className="mr-3">⏱️ {song.duration}</span>}
                                            {song.key && <span className="mr-3">🎵 {song.key}</span>}
                                            {song.tempo && <span className="mr-3">♩{song.tempo}</span>}
                                            {song.artist && <span>{song.artist}</span>}
                                          </div>
                                          {/* Strip status */}
                                          {(() => {
                                            const parts = Array.isArray(song.parts) ? song.parts : [];
                                            return (
                                              <div className="flex flex-col gap-1 mt-1">
                                                <div className="flex flex-wrap items-center gap-1">
                                                  {parts.length > 0 ? parts.map((p, i) =>
                                                    p.imageUrl ? (
                                                      <a key={i} href={p.imageUrl} target="_blank" rel="noopener noreferrer"
                                                        className="bg-green-500/30 text-green-200 text-xs px-1.5 py-0.5 rounded-full font-semibold hover:bg-green-500/50 transition-colors"
                                                        title="View strip">
                                                        {p.label || `P${i+1}`}
                                                      </a>
                                                    ) : (
                                                      <span key={i} className="bg-green-500/30 text-green-200 text-xs px-1.5 py-0.5 rounded-full font-semibold">
                                                        {p.label || `P${i+1}`}
                                                      </span>
                                                    )
                                                  ) : (
                                                    <span className="text-white/30 text-xs">no strips</span>
                                                  )}
                                                  <a
                                                    href={`upload.html?songId=${songId}&returnTo=setlist&gigId=${gig.id}`}
                                                    className="text-indigo-300 hover:text-indigo-100 text-xs px-1 py-0.5 rounded hover:bg-white/10"
                                                    title="Upload PDF to create a new strip"
                                                  >+ Strip</a>
                                                </div>
                                                {parts.some(p => p.imageUrl) && (
                                                  <div className="flex flex-wrap gap-2">
                                                    {parts.filter(p => p.imageUrl).map((p, i) => (
                                                      <a key={i} href={p.imageUrl} target="_blank" rel="noopener noreferrer" title={p.label || `Part ${i+1}`}>
                                                        <img src={p.imageUrl} alt={p.label || `Part ${i+1}`}
                                                          className="rounded border border-white/20"
                                                          style={{ height: '36px', objectFit: 'contain', objectPosition: 'left' }} />
                                                      </a>
                                                    ))}
                                                  </div>
                                                )}
                                              </div>
                                            );
                                          })()}
                                        </div>
                                        <div className="flex gap-1">
                                          <button
                                            onClick={() => moveSetlistSong(gig.id, songId, 'up')}
                                            disabled={index === 0 || !user}
                                            className={`p-1 rounded ${index === 0 || !user ? 'text-white/20' : 'text-white/60 hover:text-white hover:bg-white/10'}`}
                                            title="Move up"
                                          >
                                            <Icon name="chevron-up" />
                                          </button>
                                          <button
                                            onClick={() => moveSetlistSong(gig.id, songId, 'down')}
                                            disabled={index === gig.setlist.length - 1 || !user}
                                            className={`p-1 rounded ${index === gig.setlist.length - 1 || !user ? 'text-white/20' : 'text-white/60 hover:text-white hover:bg-white/10'}`}
                                            title="Move down"
                                          >
                                            <Icon name="chevron-down" />
                                          </button>
                                          <button
                                            onClick={() => removeFromSetlist(gig.id, songId)}
                                            disabled={!user}
                                            className={`p-1 rounded ${!user ? 'text-white/20' : 'text-red-300 hover:text-red-100 hover:bg-red-500/20'}`}
                                            title="Remove from setlist"
                                          >
                                            <Icon name="times" />
                                          </button>
                                        </div>
                                      </div>
                                      </div>
                                    );
                                  })}
                                  {dragOverSetlistIndex === gig.setlist.length && (
                                    <div className="h-0.5 bg-blue-400/70 rounded" />
                                  )}
                                </div>
                              ) : (
                                <p className="text-white/50 text-sm">No songs in setlist yet. Use the search above to add songs.</p>
                              )}
                            </div>
                          )}
                        </div>
                      )}
                    </div>
                  ))}
                  {getFilteredAndSortedGigs().length === 0 && (
                    <p className="text-white/50 text-center py-8">
                      {gigsSearch ? 'No gigs found matching your search.' : 'No gigs scheduled yet. Add your first gig to get started!'}
                    </p>
                  )}
                </div>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.render(<BandTracker />, document.getElementById('root'));
    } // end else (non-uptime path)
  </script>
</body>
</html>
